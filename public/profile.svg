<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161B"/>
      <stop offset="50%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F35C7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="ambientOrb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#ambientOrb)"/>

  <!-- Geometric Grid Pattern Lines -->
  <g stroke="#1F1F23" stroke-width="1" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="250" y1="0" x2="250" y2="700"/>
    <line x1="350" y1="0" x2="350" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/>
    <line x1="550" y1="0" x2="550" y2="700"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Central Silhouette / Avatar Concept -->
  <g transform="translate(300, 330)">
    <!-- Aura Rings -->
    <circle r="160" fill="none" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <circle r="210" fill="none" stroke="#1F1F23" stroke-width="1" stroke-dasharray="10 12" opacity="0.7"/>

    <!-- Head & Shoulders Stylized Avatar -->
    <circle cy="-70" r="65" fill="#1C1C22" stroke="#2E2E35" stroke-width="2"/>
    <path d="M -130 180 C -120 70, -70 20, 0 20 C 70 20, 120 70, 130 180 Z" fill="#18181E" stroke="#2E2E35" stroke-width="2"/>
    
    <!-- Face Accent & Monogram Center -->
    <circle cy="-70" r="40" fill="url(#violetGlow)"/>
    <text x="0" y="-56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="38" fill="#EDEDED" text-anchor="middle">SS</text>
  </g>

  <!-- Code/Telemetry Accents in Tech Matrix Style -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#8A8A93">
    <text x="40" y="60" fill="#7C5CFF">&gt; ENGINEER_PROFILE</text>
    <text x="40" y="80">STATUS: ACTIVE // AI_B.TECH</text>
    <text x="40" y="640">CORE: PYTORCH / GO / REACT18</text>
    <text x="40" y="660">LOC: 18.5204° N, 73.8567° E [PUNE]</text>
  </g>

  <!-- Accent Border Frame -->
  <rect x="20" y="20" width="560" height="660" rx="16" fill="none" stroke="#2E2E35" stroke-width="1"/>
  <line x1="20" y1="120" x2="580" y2="120" stroke="url(#accentLine)" stroke-width="1.5"/>
</svg>
