<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSocio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124"/>
      <stop offset="50%" stop-color="#100F17"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F35C7" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="cardRadial" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgSocio)"/>
  <rect width="800" height="500" fill="url(#cardRadial)"/>

  <!-- Top App Chrome Header -->
  <rect x="30" y="25" width="740" height="42" rx="8" fill="#17171C" stroke="#25252D"/>
  <circle cx="55" cy="46" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="72" cy="46" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="89" cy="46" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="120" y="37" width="220" height="18" rx="4" fill="#0E0E12" stroke="#222228"/>
  <text x="135" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7C5CFF">https://socio3.network/app</text>

  <!-- Left Sidebar Mock -->
  <rect x="30" y="80" width="180" height="390" rx="8" fill="#131317" stroke="#1F1F24"/>
  <rect x="50" y="105" width="140" height="28" rx="6" fill="#7C5CFF" fill-opacity="0.15" stroke="#7C5CFF" stroke-opacity="0.4"/>
  <text x="75" y="123" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#EDEDED">Feed // Global</text>
  <rect x="50" y="145" width="140" height="24" rx="6" fill="#18181E"/>
  <rect x="50" y="180" width="140" height="24" rx="6" fill="#18181E"/>
  <rect x="50" y="215" width="140" height="24" rx="6" fill="#18181E"/>

  <!-- Main Feed Area -->
  <rect x="225" y="80" width="545" height="390" rx="8" fill="#111115" stroke="#1F1F24"/>
  
  <!-- Post Card 1 -->
  <rect x="250" y="105" width="495" height="150" rx="8" fill="#17171D" stroke="#25252D"/>
  <circle cx="280" cy="135" r="14" fill="#7C5CFF" opacity="0.3"/>
  <text x="274" y="140" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7C5CFF">S3</text>
  <text x="305" y="135" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#EDEDED">Socio3 Protocol Contract</text>
  <text x="305" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A8A93">0x7C5c...Fa89 &bull; IPFS Verified</text>
  <text x="280" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#B0B0BC">Minted verified profile credential on-chain. Zero centralized telemetry.</text>
  
  <rect x="280" y="200" width="80" height="22" rx="4" fill="#7C5CFF" fill-opacity="0.2" stroke="#7C5CFF" stroke-opacity="0.4"/>
  <text x="290" y="215" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7C5CFF">On-Chain</text>
  <rect x="370" y="200" width="75" height="22" rx="4" fill="#202028"/>
  <text x="382" y="215" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A8A93">IPFS CID</text>

  <!-- Post Card 2 -->
  <rect x="250" y="270" width="495" height="180" rx="8" fill="#17171D" stroke="#25252D"/>
  <circle cx="280" cy="300" r="14" fill="#3B82F6" opacity="0.3"/>
  <text x="305" y="300" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#EDEDED">Micro-interaction Gas Relay</text>
  <text x="305" y="315" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A8A93">EIP-712 Meta Transactions</text>
  <text x="280" y="345" font-family="'Inter', sans-serif" font-size="12" fill="#B0B0BC">User signatures batched with sub-second finality. Zero gas fees for Web2 onboarding.</text>
</svg>
