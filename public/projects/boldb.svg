<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0A0B0E"/>
  <!-- Storage Engine Terminal & B+ Tree -->
  <rect x="30" y="25" width="740" height="42" rx="8" fill="#12141A" stroke="#20242E"/>
  <circle cx="55" cy="46" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="72" cy="46" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="89" cy="46" r="5" fill="#10B981" opacity="0.8"/>
  <text x="120" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7C5CFF">BolDB // Embedded B+ Tree Engine [C++20 &bull; WAL Enabled]</text>

  <rect x="30" y="85" width="740" height="385" rx="8" fill="#0D0E13" stroke="#1A1C24"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A93">
    <text x="60" y="130" fill="#EDEDED">&gt; boldb_bench --workload=read_heavy --threads=8</text>
    <text x="60" y="160" fill="#10B981">[INIT] PageSize: 4096 bytes | Mmap Buffer: 512MB</text>
    <text x="60" y="185">[WAL] Write-Ahead Log initialized at /var/lib/boldb/wal.log</text>
    <text x="60" y="210">[B+TREE] Root page #0 branched. Depth: 3 levels. Branching factor: 128</text>
    <text x="60" y="245" fill="#EDEDED">&gt; BENCHMARK_TELEMETRY</text>
    <text x="60" y="275" fill="#7C5CFF">&bull; Concurrent Point Queries: 250,420 ops/sec</text>
    <text x="60" y="300" fill="#7C5CFF">&bull; Range Scan Throughput:   180,110 ops/sec</text>
    <text x="60" y="325" fill="#7C5CFF">&bull; P99 Read Latency:         0.084 ms</text>
    <text x="60" y="360" fill="#10B981">[ACID PASS] Simulated sudden SIGKILL: zero corrupt pages detected.</text>
  </g>
</svg>
