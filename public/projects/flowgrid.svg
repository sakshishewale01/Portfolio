<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0B0E14"/>
  <!-- Pipeline DAG Visualization -->
  <rect x="30" y="25" width="740" height="42" rx="8" fill="#131720" stroke="#1D2433"/>
  <circle cx="55" cy="46" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="72" cy="46" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="89" cy="46" r="5" fill="#10B981" opacity="0.8"/>
  <text x="120" y="50" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#EDEDED">FlowGrid // DAG Orchestrator Pipeline [Engine: Go / gRPC]</text>

  <!-- DAG Flow Diagram -->
  <rect x="30" y="85" width="740" height="385" rx="8" fill="#0F121A" stroke="#1B212E"/>
  
  <!-- Node A -->
  <rect x="80" y="220" width="140" height="60" rx="8" fill="#171D2A" stroke="#7C5CFF"/>
  <text x="100" y="247" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDEDED">Ingest [gRPC]</text>
  <text x="100" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">&bull; OK (1.2ms)</text>

  <!-- Line A to B and C -->
  <line x1="220" y1="250" x2="320" y2="160" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="220" y1="250" x2="320" y2="340" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Node B (Filter) -->
  <rect x="320" y="130" width="150" height="60" rx="8" fill="#171D2A" stroke="#2B364C"/>
  <text x="340" y="157" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDEDED">Anomaly Filter</text>
  <text x="340" y="175" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">&bull; ACTIVE</text>

  <!-- Node C (Transformer) -->
  <rect x="320" y="310" width="150" height="60" rx="8" fill="#171D2A" stroke="#2B364C"/>
  <text x="340" y="337" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDEDED">Vector Index</text>
  <text x="340" y="355" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">&bull; ACTIVE</text>

  <!-- Line to Output -->
  <line x1="470" y1="160" x2="570" y2="250" stroke="#7C5CFF" stroke-width="2"/>
  <line x1="470" y1="340" x2="570" y2="250" stroke="#7C5CFF" stroke-width="2"/>

  <!-- Node D (Sink) -->
  <rect x="570" y="220" width="150" height="60" rx="8" fill="#171D2A" stroke="#10B981"/>
  <text x="590" y="247" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDEDED">Postgres Sink</text>
  <text x="590" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">&bull; 10k/sec write</text>
</svg>
